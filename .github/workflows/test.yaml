name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run unit tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --all-extras

      - name: Run unit tests
        env:
          XLA_FLAGS: --xla_force_host_platform_device_count=2
        run: |
          uv run pytest \
            -m "not integration" \
            --mpl --mpl-default-tolerance=10 \
            --cov=src/pyrenew_multisignal --cov-report=term --cov-report=xml .

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --all-extras

      - name: Check pyrenew version and datasets
        run: |
          .venv/bin/python -c "import pyrenew; print(pyrenew.__version__)"
          ls .venv/lib/python3.13/site-packages/pyrenew/datasets/

      - name: Run integration tests
        env:
          XLA_FLAGS: --xla_force_host_platform_device_count=2
        run: |
          uv run pytest \
            -m "integration" \
            --cov=src/pyrenew_multisignal --cov-report=term --cov-report=xml .
